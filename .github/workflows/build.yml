# Baut bei jedem Push die Android-APK, das Linux-Flatpak und die Windows-/macOS-App (Ergebnisse im Lauf unter "Artifacts").
# Auf main (Push oder manuell über "Run workflow") wird zusätzlich veröffentlicht:
#   - GitHub Release v0.3.<Laufnummer> mit APK, Flatpak, Windows-Installer und macOS-dmg (die Apps prüfen darauf auf Updates)
#   - Flatpak-Paketquelle auf GitHub Pages (Linux aktualisiert sich darüber per Softwareverwaltung/`flatpak update`)
# Benötigte Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, FLATPAK_GPG_PRIVATE_KEY
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 0.3.${{ github.run_number }}
  VERSION_CODE: ${{ github.run_number }}
  FLATPAK_GPG_KEY_ID: E060DC24B28557D3C2B18EC45B9B88367FB16ACC

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bürgerportal-Bereiche aktuell?
        run: |
          sh tools/build-portal.sh
          git diff --exit-code web/js/portal-abis.js || { echo "::error::web/js/portal-abis.js passt nicht zu portal/ – tools/build-portal.sh ausführen und einchecken"; exit 1; }
      - name: Version setzen
        run: |
          echo "window.ND_VERSION = { code: $VERSION_CODE, name: '$VERSION' };" > web/js/version.js
      - name: Signaturschlüssel
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – APK wird mit Debug-Schlüssel signiert."
          fi
      # Das Android-SDK ist auf ubuntu-latest bereits vorinstalliert (ANDROID_HOME).
      - name: APK bauen
        working-directory: android
        env:
          ND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PndVersionCode=$VERSION_CODE -PndVersionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk ../nDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nDashboard-APK
          path: nDashboard.apk

  flatpak:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Version setzen
        run: |
          echo "window.ND_VERSION = { code: $VERSION_CODE, name: '$VERSION' };" > web/js/version.js
          # Versionsangabe für Softwareverwaltung (GNOME Software, Discover)
          sed -i "s#<releases>#<releases>\n    <release version=\"$VERSION\" date=\"$(date -u +%F)\" />#" linux/de.nikesieg4.nDashboard.metainfo.xml
      - name: Flatpak-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Signaturschlüssel
        id: key
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            echo "GPG_ARGS=--gpg-sign=$FLATPAK_GPG_KEY_ID" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret FLATPAK_GPG_PRIVATE_KEY fehlt – Paketquelle wird nicht signiert."
          fi
      - name: Flatpak bauen
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub $GPG_ARGS \
            --default-branch=stable --state-dir=$RUNNER_TEMP/state --repo=repo $RUNNER_TEMP/build linux/de.nikesieg4.nDashboard.yml
          flatpak build-update-repo $GPG_ARGS --generate-static-deltas --prune repo
          flatpak build-bundle repo nDashboard.flatpak de.nikesieg4.nDashboard stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          tar -cf flatpak-repo.tar repo
      - uses: actions/upload-artifact@v4
        with:
          name: nDashboard-Flatpak
          path: nDashboard.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo.tar

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
            artifact: nDashboard-Windows
            files: |
              desktop/dist/nDashboard-Setup.exe
              desktop/dist/nDashboard-Setup.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            target: --mac dmg --universal
            artifact: nDashboard-Mac
            files: desktop/dist/nDashboard.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Version setzen
        run: |
          echo "window.ND_VERSION = { code: $VERSION_CODE, name: '$VERSION' };" > web/js/version.js
          cd desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: App bauen
        working-directory: desktop
        env:
          # nicht signiert: Windows ohne Zertifikat, macOS nur ad-hoc (kein Apple-Entwicklerkonto)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  publish:
    # auch bei manuellem Start ("Run workflow") auf main
    if: github.ref == 'refs/heads/main'
    needs: [apk, flatpak, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Signaturen prüfen
        if: needs.apk.outputs.signed != 'true' || needs.flatpak.outputs.signed != 'true'
        run: |
          echo "::error::Veröffentlichen braucht die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD und FLATPAK_GPG_PRIVATE_KEY (siehe README, Abschnitt Updates)."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="artifacts/nDashboard-APK/nDashboard.apk artifacts/nDashboard-Flatpak/nDashboard.flatpak"
          # latest.yml + .blockmap braucht das Windows-Update (electron-updater)
          FILES="$FILES artifacts/nDashboard-Windows/nDashboard-Setup.exe artifacts/nDashboard-Windows/nDashboard-Setup.exe.blockmap artifacts/nDashboard-Windows/latest.yml"
          FILES="$FILES artifacts/nDashboard-Mac/nDashboard.dmg"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # erneuter Versuch desselben Laufs: Dateien des vorhandenen Releases ersetzen
            gh release upload "v$VERSION" $FILES --clobber
          else
            gh release create "v$VERSION" $FILES --target "$GITHUB_SHA" --title "nDashboard $VERSION" \
              --notes "$(git log -1 --format=%B "$GITHUB_SHA" | sed '/^Co-Authored-By:/d;/^Claude-Session:/d')"
          fi
      - name: Flatpak-Paketquelle zusammenstellen
        run: |
          mkdir site
          tar -xf artifacts/flatpak-repo/flatpak-repo.tar -C site
          KEY=$(cat linux/flatpak-repo-key.gpg.base64)
          URL=https://nikesieg4.github.io/nDashboard
          printf '[Flatpak Repo]\nTitle=nDashboard\nUrl=%s/repo/\nHomepage=https://github.com/nikesieg4/nDashboard\nGPGKey=%s\n' "$URL" "$KEY" > site/ndashboard.flatpakrepo
          printf '[Flatpak Ref]\nName=de.nikesieg4.nDashboard\nBranch=stable\nTitle=nDashboard\nUrl=%s/repo/\nSuggestRemoteName=ndashboard\nRuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\nIsRuntime=false\nGPGKey=%s\n' "$URL" "$KEY" > site/ndashboard.flatpakref
          printf '<!doctype html><meta charset="utf-8"><title>nDashboard</title><h1>nDashboard %s</h1><p>Linux: <code>flatpak install --user %s/ndashboard.flatpakref</code></p><p>Android, Windows, macOS: <a href="https://github.com/nikesieg4/nDashboard/releases/latest">neuestes Release</a> (nDashboard.apk, nDashboard-Setup.exe, nDashboard.dmg)</p>\n' "$VERSION" "$URL" > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
