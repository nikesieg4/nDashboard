# Baut die Android-APK und das Linux-Flatpak bei jedem Push.
# Ergebnisse: im Actions-Lauf unter "Artifacts" herunterladen.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Das Android-SDK ist auf ubuntu-latest bereits vorinstalliert (ANDROID_HOME).
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../nDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nDashboard-APK
          path: nDashboard.apk

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Flatpak bauen
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --state-dir=$RUNNER_TEMP/state --repo=$RUNNER_TEMP/repo $RUNNER_TEMP/build linux/de.nikesieg4.nDashboard.yml
          flatpak build-bundle $RUNNER_TEMP/repo nDashboard.flatpak de.nikesieg4.nDashboard \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: nDashboard-Flatpak
          path: nDashboard.flatpak
