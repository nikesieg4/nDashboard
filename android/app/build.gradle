plugins {
    id 'com.android.application'
}

android {
    namespace 'de.nikesieg4.ndashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'de.nikesieg4.ndashboard'
        minSdk 24
        targetSdk 34
        // GitHub Actions setzt beides pro Build (-PndVersionCode / -PndVersionName)
        versionCode = (project.findProperty('ndVersionCode') ?: '1').toInteger()
        versionName = project.findProperty('ndVersionName') ?: '0.3.0-dev'
    }

    // Die Oberfläche liegt im gemeinsamen Ordner web/ und wird direkt als Asset eingebunden.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    // Fester Release-Schlüssel aus GitHub Secrets, damit sich Updates über die alte Version
    // installieren lassen. Ohne Schlüssel (lokal, Pull Requests) wird mit dem Debug-Schlüssel signiert.
    def keystore = System.getenv('ND_KEYSTORE')
    signingConfigs {
        if (keystore && file(keystore).exists()) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('ND_KEYSTORE_PASSWORD')
                keyAlias 'ndashboard'
                keyPassword System.getenv('ND_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
